# Render Blueprint — https://dashboard.render.com/blueprint/new?repo=https://github.com/satwikmed/diligence-ai
# Note: free tier has no persistent disk — SQLite/uploads reset on redeploy (OK for demo).
services:
  - type: web
    name: diligence-ai-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///diligence.db
      - key: PYTHONUNBUFFERED
        value: "1"
