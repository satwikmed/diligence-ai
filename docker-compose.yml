version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./diligence.db:/app/diligence.db
      - ./uploads:/app/uploads
      - ./data/sample_docs:/app/data/sample_docs
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///diligence.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
